<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Script-to-Notebook AI</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              cello: '#1F4060',
              chambray: '#3B5B8C',
              waikawa: '#5C7999',
              casper: '#A7C2D3',
              merino: '#F2E7DE',
            }
          }
        }
      }
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
      body {
        font-family: 'Outfit', sans-serif;
        background-color: #1F4060; /* Cello base */
        color: #F2E7DE; /* Merino text */
        overflow-x: hidden;
      }
      /* Custom scrollbar for code blocks */
      .custom-scrollbar::-webkit-scrollbar {
        width: 8px;
        height: 8px;
      }
      .custom-scrollbar::-webkit-scrollbar-track {
        background: rgba(31, 64, 96, 0.5); /* Cello with opacity */
      }
      .custom-scrollbar::-webkit-scrollbar-thumb {
        background: #5C7999; /* Waikawa */
        border-radius: 4px;
      }
      .custom-scrollbar::-webkit-scrollbar-thumb:hover {
        background: #A7C2D3; /* Casper */
      }
      
      /* Glassmorphism utilities */
      .glass-panel {
        background: rgba(255, 255, 255, 0.03);
        backdrop-filter: blur(12px);
        -webkit-backdrop-filter: blur(12px);
        border: 1px solid rgba(167, 194, 211, 0.1); /* Casper border low opacity */
      }
      
      .glass-card {
        background: rgba(31, 64, 96, 0.6); /* Cello */
        backdrop-filter: blur(8px);
        border: 1px solid rgba(167, 194, 211, 0.1); /* Casper border */
      }
    </style>
  <script type="importmap">
{
  "imports": {
    "lucide-react": "https://esm.sh/lucide-react@^0.563.0",
    "react-dom/": "https://esm.sh/react-dom@^19.2.4/",
    "@google/genai": "https://esm.sh/@google/genai@^1.39.0",
    "react/": "https://esm.sh/react@^19.2.4/",
    "react": "https://esm.sh/react@^19.2.4",
    "react-markdown": "https://esm.sh/react-markdown@^10.1.0",
    "react-syntax-highlighter": "https://esm.sh/react-syntax-highlighter@15.5.0?external=react,react-dom",
    "react-syntax-highlighter/dist/esm/styles/prism": "https://esm.sh/react-syntax-highlighter@15.5.0/dist/esm/styles/prism?external=react,react-dom",
    "framer-motion": "https://esm.sh/framer-motion@11.18.2?external=react,react-dom",
    "react-syntax-highlighter/": "https://esm.sh/react-syntax-highlighter@^16.1.0/"
  }
}
</script>
</head>
  <body class="antialiased selection:bg-chambray selection:text-merino">
    <div id="root"></div>
  </body>
</html>
